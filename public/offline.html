<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff7fb" />
    <title>Offline · Dare Battles</title>
    <style>
      :root { color-scheme: light; --fg: #3a1f4d; --muted: #6f5584; --pink: #ff3d9a; --purple: #a855f7; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        font: 16px/1.5 ui-rounded, "Poppins", system-ui, sans-serif; color: var(--fg);
        background:
          radial-gradient(70% 40% at 15% 0%, rgb(186 230 253 / 0.7), transparent 70%),
          radial-gradient(60% 40% at 90% 10%, rgb(251 207 232 / 0.75), transparent 70%),
          radial-gradient(80% 50% at 50% 105%, rgb(233 213 255 / 0.7), transparent 70%),
          #fff7fb;
      }
      main { width: 100%; max-width: 342px; text-align: center; }
      img { width: 150px; height: 150px; object-fit: contain; filter: drop-shadow(0 10px 18px rgb(160 80 140 / 0.22)); }
      h1 { margin: 16px 0 6px; font-size: 26px; line-height: 1.25; font-weight: 800; text-wrap: balance; }
      p { margin: 0 auto; max-width: 290px; color: var(--muted); font-size: 15px; }
      button {
        margin-top: 28px; width: 100%; height: 56px; border: 0; border-radius: 16px; cursor: pointer;
        font: inherit; font-weight: 600; color: #fff;
        background: linear-gradient(135deg, #dc1474, #9b3df0);
        box-shadow: 0 12px 32px -10px rgb(255 61 154 / 0.8);
        transition: transform 0.15s cubic-bezier(0.16, 1, 0.3, 1);
        -webkit-tap-highlight-color: transparent;
      }
      button:active { transform: scale(0.97); }
      button:focus-visible { outline: 3px solid rgb(255 61 154 / 0.5); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/gifs/cry.webp" alt="" />
      <h1>Internet chala gaya</h1>
      <p>Connection wapas aate hi battle wahi se chalu ho jayega. Tumhara room aur score safe hai.</p>
      <button type="button" onclick="location.reload()">Dobara try karo</button>
    </main>
    <script>addEventListener("online", () => location.reload())</script>
  </body>
</html>
